# Nginx reverse proxy untuk Ekakarsa Point.
# Salin ke /etc/nginx/sites-available/ekakarsa, ganti DOMAIN_ANDA, lalu:
#   sudo ln -s /etc/nginx/sites-available/ekakarsa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN_ANDA        # pasang HTTPS gratis (Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA;

    # Batas upload (import Excel anggota)
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
